  <line x1="170" y1="142" x2="128" y2="180" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="540" y1="140" x2="586" y2="172" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="190" y1="240" x2="128" y2="180" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="530" y1="232" x2="586" y2="172" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="280" y1="298" x2="220" y2="340" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="400" y1="326" x2="480" y2="348" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="460" y1="286" x2="530" y2="310" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Central trait node -->
  <circle cx="360" cy="220" r="18" fill="#0F766E" stroke="#0D9488" stroke-width="2"/>
