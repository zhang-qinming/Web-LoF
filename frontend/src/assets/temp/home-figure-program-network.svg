  <circle cx="190" cy="240" r="12" fill="#14B8A6" fill-opacity="0.85" stroke="#0D9488" stroke-width="1.5"/>
  <text x="190" y="244" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700">P5</text>

  <circle cx="530" cy="232" r="12" fill="#F97316" fill-opacity="0.85" stroke="#EA580C" stroke-width="1.5"/>
  <text x="530" y="236" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700">P6</text>

  <circle cx="320" cy="140" r="12" fill="#EC4899" fill-opacity="0.85" stroke="#DB2777" stroke-width="1.5"/>
  <text x="320" y="144" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700">P7</text>

  <circle cx="400" cy="326" r="12" fill="#6366F1" fill-opacity="0.85" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700">P8</text>

  <!-- Peripheral gene nodes (small) -->
  <circle cx="170" cy="142" r="7" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="128" cy="180" r="6" fill="#E0F2FE" stroke="#60A5FA" stroke-width="1"/>
  <circle cx="540" cy="140" r="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <circle cx="586" cy="172" r="6" fill="#FED7AA" stroke="#F97316" stroke-width="1"/>
  <circle cx="220" cy="340" r="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <circle cx="480" cy="348" r="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <circle cx="530" cy="310" r="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>

  <!-- legend -->
  <circle cx="82" cy="362" r="5" fill="#0F766E"/>
  <text x="94" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">trait</text>
  <circle cx="140" cy="362" r="5" fill="#F59E0B"/>
  <text x="152" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">program</text>
  <circle cx="218" cy="362" r="4" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
  <text x="228" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">gene</text>
</svg>
