<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="420" rx="28" fill="#F8FAFC"/>
  <rect x="42" y="42" width="636" height="336" rx="22" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="62" y="82" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Program network</text>
  <text x="62" y="106" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">Force-directed gene program graph</text>

  <!-- Edges (drawn first, behind nodes) -->
  <!-- central hub edges -->
  <line x1="360" y1="220" x2="240" y2="166" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="470" y2="158" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="280" y2="298" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="460" y2="286" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="190" y2="240" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="530" y2="232" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="320" y2="140" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="360" y1="220" x2="400" y2="326" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- secondary edges -->
