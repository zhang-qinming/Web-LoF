  <line x1="470" y1="158" x2="540" y2="140" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="470" y1="158" x2="530" y2="232" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="280" y1="298" x2="190" y2="240" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="280" y1="298" x2="400" y2="326" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="460" y1="286" x2="530" y2="232" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="460" y1="286" x2="400" y2="326" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="320" y1="140" x2="470" y2="158" stroke="#E2E8F0" stroke-width="1.2"/>

