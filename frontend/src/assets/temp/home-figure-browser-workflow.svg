<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="960" height="420" rx="32" fill="#F8FAFC"/>
  <!-- inner panel -->
  <rect x="24" y="24" width="912" height="372" rx="26" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <!-- title -->
  <text x="54" y="68" fill="#2563EB" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Browser workflow</text>
  <text x="54" y="96" fill="#64748B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15">Move from trait entry to signal filtering, program context, and final export retrieval</text>

  <!-- connecting flow curve (thick background track) -->
  <path d="M136 238C204 188 262 166 334 178C408 190 462 286 544 274C642 258 694 146 804 138" stroke="#E2E8F0" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- connecting flow curve (thin colored overlay) -->
  <path d="M136 238C204 188 262 166 334 178C408 190 462 286 544 274C642 258 694 146 804 138" stroke="url(#flowGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- arrowhead -->
  <polygon points="800,126 828,136 804,152" fill="#475569"/>

  <!-- Step 1: Trait registry -->
  <circle cx="136" cy="238" r="44" fill="#2563EB" fill-opacity="0.1" stroke="#93C5FD" stroke-width="2.5"/>
  <circle cx="136" cy="238" r="16" fill="#2563EB"/>
  <text x="136" y="244" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <rect x="60" y="298" width="154" height="78" rx="18" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="2"/>
  <text x="137" y="326" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Trait registry</text>
  <text x="137" y="348" text-anchor="middle" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">metadata intake</text>
  <text x="137" y="366" text-anchor="middle" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">phenotype + GWAS context</text>

  <!-- Step 2: Signal screen -->
  <circle cx="334" cy="178" r="44" fill="#EA580C" fill-opacity="0.1" stroke="#FDBA74" stroke-width="2.5"/>
  <circle cx="334" cy="178" r="16" fill="#B45309"/>
  <text x="334" y="184" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">2</text>
  <rect x="256" y="236" width="160" height="78" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="336" y="264" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Signal screen</text>
  <text x="336" y="286" text-anchor="middle" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">CHR / BP / P / rsID</text>
  <text x="336" y="304" text-anchor="middle" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">constrain loci first</text>

  <!-- Step 3: Gene &amp; program -->
  <circle cx="544" cy="274" r="44" fill="#0F766E" fill-opacity="0.1" stroke="#99F6E4" stroke-width="2.5"/>
  <circle cx="544" cy="274" r="16" fill="#0F766E"/>
  <text x="544" y="280" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <rect x="462" y="328" width="168" height="78" rx="18" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="2"/>
  <text x="546" y="356" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Gene &amp; program</text>
  <text x="546" y="378" text-anchor="middle" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">contextual evidence</text>
  <text x="546" y="396" text-anchor="middle" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">regulator → program links</text>

  <!-- Step 4: Data reuse -->
  <circle cx="804" cy="138" r="44" fill="#475569" fill-opacity="0.1" stroke="#CBD5E1" stroke-width="2.5"/>
  <circle cx="804" cy="138" r="16" fill="#334155"/>
  <text x="804" y="144" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">4</text>
  <rect x="728" y="198" width="154" height="78" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="805" y="226" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Data reuse</text>
  <text x="805" y="248" text-anchor="middle" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">browse &amp; download</text>
  <text x="805" y="266" text-anchor="middle" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">export derived outputs</text>

  <!-- mini-connector arrows between step labels and nodes -->
  <line x1="137" y1="294" x2="137" y2="298" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  <line x1="336" y1="232" x2="336" y2="236" stroke="#FDBA74" stroke-width="2" stroke-linecap="round"/>
  <line x1="546" y1="322" x2="546" y2="328" stroke="#99F6E4" stroke-width="2" stroke-linecap="round"/>
  <line x1="805" y1="186" x2="805" y2="198" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <defs>
    <linearGradient id="flowGrad" x1="136" y1="238" x2="804" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.33" stop-color="#B45309"/>
      <stop offset="0.66" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>
</svg>
