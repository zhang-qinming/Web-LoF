<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="420" rx="28" fill="#F8FAFC"/>
  <rect x="42" y="42" width="636" height="336" rx="22" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="62" y="82" fill="#2563EB" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Trait correlation</text>
  <text x="62" y="106" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">Pairwise genetic correlation matrix</text>

  <!-- 6×6 heatmap with labels, fits cleanly -->
  <g transform="translate(140 136)">
    <!-- column labels (top) -->
    <text transform="rotate(-45 14 -6)" x="14" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">BMI</text>
    <text transform="rotate(-45 48 -6)" x="48" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">T2D</text>
    <text transform="rotate(-45 82 -6)" x="82" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">CAD</text>
    <text transform="rotate(-45 116 -6)" x="116" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">HTN</text>
    <text transform="rotate(-45 150 -6)" x="150" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">SLE</text>
    <text transform="rotate(-45 184 -6)" x="184" y="-6" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">SCZ</text>

    <!-- row labels (left) -->
    <text x="-8" y="22" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">BMI</text>
    <text x="-8" y="56" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">T2D</text>
    <text x="-8" y="90" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">CAD</text>
    <text x="-8" y="124" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">HTN</text>
    <text x="-8" y="158" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">SLE</text>
    <text x="-8" y="192" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">SCZ</text>

    <!-- 6x6 grid: 30x30 cells, 4px gap -->
    <!-- Row 0: BMI -->
    <rect x="0" y="6" width="30" height="30" rx="4" fill="#1D4ED8"/>
    <rect x="34" y="6" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="68" y="6" width="30" height="30" rx="4" fill="#D8875F"/>
    <rect x="102" y="6" width="30" height="30" rx="4" fill="#D47C58"/>
    <rect x="136" y="6" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="170" y="6" width="30" height="30" rx="4" fill="#7A9DBE"/>

    <!-- Row 1: T2D -->
    <rect x="0" y="40" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="34" y="40" width="30" height="30" rx="4" fill="#1D4ED8"/>
    <rect x="68" y="40" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="102" y="40" width="30" height="30" rx="4" fill="#D8875F"/>
    <rect x="136" y="40" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="170" y="40" width="30" height="30" rx="4" fill="#EEF2F6"/>

    <!-- Row 2: CAD -->
    <rect x="0" y="74" width="30" height="30" rx="4" fill="#D8875F"/>
    <rect x="34" y="74" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="68" y="74" width="30" height="30" rx="4" fill="#1D4ED8"/>
    <rect x="102" y="74" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="136" y="74" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="170" y="74" width="30" height="30" rx="4" fill="#6A8CB4"/>

    <!-- Row 3: HTN -->
    <rect x="0" y="108" width="30" height="30" rx="4" fill="#D47C58"/>
    <rect x="34" y="108" width="30" height="30" rx="4" fill="#D8875F"/>
    <rect x="68" y="108" width="30" height="30" rx="4" fill="#C96A43"/>
    <rect x="102" y="108" width="30" height="30" rx="4" fill="#1D4ED8"/>
    <rect x="136" y="108" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="170" y="108" width="30" height="30" rx="4" fill="#EEF2F6"/>

    <!-- Row 4: SLE -->
    <rect x="0" y="142" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="34" y="142" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="68" y="142" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="102" y="142" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="136" y="142" width="30" height="30" rx="4" fill="#1D4ED8"/>
    <rect x="170" y="142" width="30" height="30" rx="4" fill="#EEF2F6"/>

    <!-- Row 5: SCZ -->
    <rect x="0" y="176" width="30" height="30" rx="4" fill="#7A9DBE"/>
    <rect x="34" y="176" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="68" y="176" width="30" height="30" rx="4" fill="#6A8CB4"/>
    <rect x="102" y="176" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="136" y="176" width="30" height="30" rx="4" fill="#EEF2F6"/>
    <rect x="170" y="176" width="30" height="30" rx="4" fill="#1D4ED8"/>
  </g>

  <!-- color bar -->
  <text x="420" y="158" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">rg</text>
  <text x="410" y="176" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9">positive</text>
  <rect x="432" y="182" width="14" height="110" rx="7" fill="url(#corrbar)"/>
  <text x="410" y="304" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9">negative</text>
  <text x="452" y="196" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9">1.0</text>
  <text x="452" y="240" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9">0.0</text>
  <text x="452" y="286" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9">-1.0</text>

  <text x="420" y="340" fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">diagonal = self (1.0)</text>

  <defs>
    <linearGradient id="corrbar" x1="439" y1="182" x2="439" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C96A43"/>
      <stop offset="0.5" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#527EA8"/>
    </linearGradient>
  </defs>
</svg>
