<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="420" rx="28" fill="#F8FAFC"/>
  <rect x="42" y="42" width="636" height="336" rx="22" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="62" y="82" fill="#D97706" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Variant detail</text>
  <text x="62" y="106" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13">SNP-level metadata and association summary</text>

  <!-- main card area -->
  <rect x="72" y="126" width="290" height="226" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>

  <!-- SNP header -->
  <rect x="88" y="142" width="100" height="24" rx="12" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="138" y="158" text-anchor="middle" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">rs7903146</text>
  <rect x="196" y="142" width="62" height="24" rx="12" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="227" y="158" text-anchor="middle" fill="#2563EB" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">chr10</text>
  <rect x="266" y="142" width="80" height="24" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="306" y="158" text-anchor="middle" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">missense</text>

  <!-- key-value pairs -->
  <text x="92" y="190" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Gene</text>
  <text x="172" y="190" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">TCF7L2</text>
  <line x1="88" y1="198" x2="348" y2="198" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="216" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">P-value</text>
  <text x="172" y="216" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">2.4 × 10⁻¹²</text>
  <line x1="88" y1="224" x2="348" y2="224" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="242" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Beta</text>
  <text x="172" y="242" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">0.312 (SE 0.044)</text>
  <line x1="88" y1="250" x2="348" y2="250" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="268" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">MAF</text>
  <text x="172" y="268" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">0.287</text>
  <line x1="88" y1="276" x2="348" y2="276" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="294" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">CHR:BP</text>
  <text x="172" y="294" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">10:114,758,349</text>
  <line x1="88" y1="302" x2="348" y2="302" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="320" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">A1 / A2</text>
  <text x="172" y="320" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">T / C</text>
  <line x1="88" y1="328" x2="348" y2="328" stroke="#FDE68A" stroke-width="1"/>

  <text x="92" y="346" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Trait</text>
  <text x="172" y="346" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Type 2 Diabetes</text>

  <!-- right side: mini forest plot -->
  <rect x="384" y="126" width="280" height="226" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="404" y="150" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Effect across studies</text>

  <!-- forest plot lines -->
  <line x1="524" y1="168" x2="524" y2="328" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- study rows -->
  <text x="404" y="186" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">UKBB</text>
  <line x1="498" y1="182" x2="558" y2="182" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <circle cx="528" cy="182" r="3.5" fill="#2563EB"/>

  <text x="404" y="210" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">FinnGen</text>
  <line x1="510" y1="206" x2="560" y2="206" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <circle cx="535" cy="206" r="3.5" fill="#2563EB"/>

  <text x="404" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">BioBank JP</text>
  <line x1="504" y1="230" x2="570" y2="230" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <circle cx="537" cy="230" r="3" fill="#2563EB"/>

  <text x="404" y="258" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">CARDIoGRAM</text>
  <line x1="492" y1="254" x2="548" y2="254" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <circle cx="520" cy="254" r="3" fill="#2563EB"/>

  <text x="404" y="282" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="10">DIAGRAM</text>
  <line x1="506" y1="278" x2="554" y2="278" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <circle cx="530" cy="278" r="3.5" fill="#2563EB"/>

  <!-- meta-analysis summary diamond -->
  <line x1="404" y1="306" x2="640" y2="306" stroke="#E2E8F0" stroke-width="1"/>
  <text x="404" y="322" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Meta</text>
  <polygon points="524,318 518,322 524,326 530,322" fill="#1D4ED8"/>
</svg>
