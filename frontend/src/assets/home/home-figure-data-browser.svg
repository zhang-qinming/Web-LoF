<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="720" height="420" rx="28" fill="#F8FAFC"/>
  <!-- inner panel -->
  <rect x="42" y="42" width="636" height="336" rx="22" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <!-- title -->
  <text x="62" y="82" fill="#B45309" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Data browser / export table</text>
  <text x="62" y="108" fill="#64748B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14">Structured file retrieval with filters, counts, and row-level export actions</text>

  <!-- search toolbar -->
  <rect x="62" y="130" width="596" height="56" rx="16" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <!-- search input -->
  <rect x="82" y="146" width="260" height="24" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <!-- search icon placeholder -->
  <circle cx="96" cy="156" r="5.5" fill="none" stroke="#B45309" stroke-width="1.5"/>
  <line x1="100" y1="161" x2="104" y2="166" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="162" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="12">Search files or folders…</text>
  <!-- filter chips -->
  <rect x="358" y="146" width="60" height="24" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#FCD34D" stroke-width="1"/>
  <text x="368" y="162" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">All types</text>
  <rect x="426" y="146" width="52" height="24" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#FCD34D" stroke-width="1"/>
  <text x="436" y="162" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Sorted</text>
  <!-- download button -->
  <rect x="518" y="144" width="120" height="28" rx="14" fill="#F59E0B" fill-opacity="0.18" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="530" y="163" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Download selected</text>

  <!-- table container -->
  <rect x="62" y="204" width="596" height="148" rx="16" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- table header row -->
  <rect x="76" y="216" width="568" height="28" rx="10" fill="#F1F5F9"/>
  <text x="92" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">☐</text>
  <text x="116" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">File name</text>
  <text x="366" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Type</text>
  <text x="456" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Size</text>
  <text x="546" y="234" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Action</text>

  <!-- data row 1 -->
  <rect x="76" y="250" width="568" height="28" rx="10" fill="white"/>
  <rect x="92" y="258" width="12" height="12" rx="3" fill="#F6AD55"/>
  <rect x="116" y="260" width="220" height="9" rx="4.5" fill="#CBD5E1"/>
  <rect x="366" y="260" width="72" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="456" y="260" width="48" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="540" y="254" width="62" height="20" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="556" y="268" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Export</text>

  <!-- data row 2 -->
  <rect x="76" y="284" width="568" height="28" rx="10" fill="white"/>
  <rect x="92" y="292" width="12" height="12" rx="3" fill="#F6AD55"/>
  <rect x="116" y="294" width="260" height="9" rx="4.5" fill="#CBD5E1"/>
  <rect x="366" y="294" width="72" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="456" y="294" width="48" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="540" y="288" width="62" height="20" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="556" y="302" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Export</text>

  <!-- data row 3 -->
  <rect x="76" y="318" width="568" height="28" rx="10" fill="white"/>
  <rect x="92" y="326" width="12" height="12" rx="3" fill="#F6AD55"/>
  <rect x="116" y="328" width="196" height="9" rx="4.5" fill="#CBD5E1"/>
  <rect x="366" y="328" width="72" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="456" y="328" width="48" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="540" y="322" width="62" height="20" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="556" y="336" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">Export</text>

  <!-- pagination hint -->
  <text x="360" y="372" text-anchor="middle" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">1 – 3 of 247 files  ·  page 1 of 83</text>
</svg>
